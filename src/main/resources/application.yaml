server:
  port: 8081
spring:
  application:
    name: HomeService
  datasource:
    url: jdbc:postgresql://localhost:5432/homeservice
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  sql: 
    init: 
      mode: always
jwt:
  secret: "this-is-a-very-long-secret-key-that-is-at-least-32-bytes-long-for-jjwt"
  expirationMs: 86400000
  cookieName: jwt_cookie
  cookieMaxAge: 86400
logging:
  level:
    root: ERROR